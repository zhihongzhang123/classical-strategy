name: 内容质量检查

on:
  push:
    paths:
      - '**.md'
  pull_request:
    paths:
      - '**.md'

jobs:
  validate-content:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: 设置 Python 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
    
    - name: 运行内容验证
      run: |
        python scripts/validate-content.py
    
    - name: 生成升级报告（可选）
      run: |
        python scripts/upgrade-content.py || true
